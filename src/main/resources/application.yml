server:
  port:8080
spring:
  application:
    name: pedido-observavel
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus #expõe esses endpoints
  endpoint:
    health:
      show-details: always
    metrics:
      tags:
        application: ${spring.application.name}
    tracing:
      sampling:
        probability: 1.0
    zipkin:
      tracing:
        endpoint: http://localhost:9411/api/v2/spans

  logging:
    pattern: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}"